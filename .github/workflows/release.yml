name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-release:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-bullseye

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            patchelf \
            zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nxs-analysis-tools || python -m pip install git+https://github.com/stevenjgomez/nxs_analysis_tools.git
          python -m pip install -e ".[build]"

      - name: Build standalone executable
        run: |
          ./scripts/build_distribution.sh

      - name: Package release artifact
        run: |
          cd dist
          zip -j CGTProject-linux-x86_64.zip CGTProjectApp/CGTProject

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CGTProject-linux-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}