
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CGTProject"
version = "0.1.0"
description = "GUI Application Toolkit for CLASSE"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
	"numpy",
	"scipy",
	"matplotlib",
	"pandas",
	"PyQt5",
	"h5py",
	"psutil",
	"lmfit",
	"astropy",
	"pyfftw",
	"nexusformat",
    "dask",
	"pooch",
	"nxs-analysis-tools",
]

[project.scripts]
cgtproject = "CGTProject.main:main"

[project.optional-dependencies]
build = [
	"build",
	"pyinstaller>=6.0",
]
test = [
	"pytest>=7.0",
	"pytest-qt",
]

[tool.setuptools.packages.find]
include = ["CGTProject*"]
exclude = ["builds*", "logs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
	"unit: unit tests",
	"integration: integration tests",
	"slow: slow tests (deselect with -m 'not slow')",
]

